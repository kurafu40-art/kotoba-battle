<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#161224">
<title>ことばバトル！ Flashゲーム風 対AI版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#241d2c;--panel:#fffaf3;--line:#d9cbbf;--accent:#ff5f78;--blue:#298de5;--gold:#f5b83d}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15111f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:var(--ink)}
button{font:inherit;border:0;touch-action:manipulation}
#game{width:min(100vw,760px);height:100dvh;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#fff8ed,#f1efff);box-shadow:0 0 40px #0008}
.screen{position:absolute;inset:0;display:none;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));overflow:hidden}
.screen.on{display:flex;flex-direction:column}
.logo{text-align:center;font-size:clamp(27px,7vw,45px);font-weight:1000;letter-spacing:.04em;text-shadow:0 3px #fff;margin:4px 0 8px}
.sub{text-align:center;color:#766d78;font-weight:800;font-size:13px;margin-bottom:8px}
.panel{background:#fffdf9;border:2px solid #e6d8ce;border-radius:18px;box-shadow:0 5px 0 #d8c9c0,0 9px 22px #604d6620}
.selectWrap{display:grid;grid-template-columns:1fr;gap:9px;overflow:auto;padding:3px 2px 8px}
.charCard{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:9px;padding:9px;text-align:left;background:#fff;border:3px solid transparent;border-radius:17px;box-shadow:0 4px 0 #d7cbd1}
.charCard.sel{border-color:#ff6c83;transform:translateY(2px);box-shadow:0 2px 0 #c9b7c0}
.portrait{height:70px;border-radius:14px;display:grid;place-items:center;font-size:38px;font-weight:900}
.hozuki .portrait{background:linear-gradient(135deg,#36151a,#ff6b42);color:white}
.nefer .portrait{background:linear-gradient(135deg,#09264c,#19a9c5);color:#ffe293}
.toma .portrait{background:linear-gradient(135deg,#ffb7c7,#bde8b1);color:white}
.cname{font-size:20px;font-weight:1000}.ctag{font-size:12px;font-weight:900;color:#746a73;margin-top:2px}.cdesc{font-size:12px;margin-top:3px}
.aiPick{padding:10px;margin:8px 0}.aiRow{display:flex;gap:7px}.mini{flex:1;padding:9px 4px;border-radius:12px;background:#f1edf2;font-weight:900}.mini.sel{background:#32273d;color:white}
.bigBtn{width:100%;padding:14px;border-radius:15px;background:linear-gradient(#ff6b82,#ef4d69);color:#fff;font-weight:1000;font-size:18px;box-shadow:0 5px 0 #ba334a}.bigBtn:disabled{filter:grayscale(1);opacity:.45;box-shadow:none}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:7px;margin-bottom:6px}
.badge{background:#30273a;color:#fff;padding:7px 9px;border-radius:12px;font-weight:1000;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-size:31px;font-weight:1000;font-variant-numeric:tabular-nums}
.stats{display:flex;justify-content:center;gap:12px;font-size:15px;font-weight:1000;margin-bottom:6px}
.wordBox{height:52px;border:3px dashed #d8cbd0;border-radius:15px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:1000;letter-spacing:.08em;margin-bottom:7px;overflow:hidden}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{height:min(10vh,62px);background:#fff;border:2px solid #e5d9d4;border-radius:15px;color:#178be1;font-size:25px;font-weight:1000;box-shadow:0 3px 0 #d7cbd0}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:7px}
.tool{padding:10px 5px;border-radius:12px;background:#eee8ed;color:#2586d3;font-weight:1000}
.decide{background:#ff617a;color:white}
.growLog{flex:1;min-height:48px;margin-top:7px;padding:8px 10px;background:#272131;color:#fff;border-radius:13px;font-size:11px;overflow:auto}
#battle{background:radial-gradient(circle at 50% 35%,#fff7d8,#eadff4 55%,#b7c7e9)}
.arena{flex:1;display:flex;flex-direction:column;min-height:0}
.fighter{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center;padding:7px}
.fighter.enemy{grid-template-columns:1fr 72px;text-align:right}.fighter.enemy .avatar{order:2}
.avatar{height:68px;border-radius:18px;display:grid;place-items:center;font-size:39px;background:#fff;border:3px solid #fff;box-shadow:0 4px 10px #0003;transition:.15s}
.hit{animation:hit .25s}@keyframes hit{50%{transform:translateX(9px) rotate(3deg);filter:brightness(1.7)}}
.hpbar{height:15px;border-radius:20px;background:#3b3442;overflow:hidden;border:2px solid #fff}.hpfill{height:100%;background:linear-gradient(90deg,#50c86b,#b7e34d);transition:.35s}
.fmeta{font-weight:1000;font-size:12px;margin-bottom:3px}.effects{font-size:11px;min-height:15px;color:#5f5365;font-weight:800}
.vs{text-align:center;font-size:18px;font-weight:1000;margin:-2px 0}
.battleLog{height:96px;background:#241e2cdd;color:white;border-radius:13px;padding:8px;font-size:11px;overflow:auto;margin:5px 0}
.commands{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.cmd{min-height:55px;border-radius:14px;color:white;font-weight:1000;font-size:15px;box-shadow:0 4px 0 #0004}
.attack{background:#d94d4d}.guard{background:#4b79c9}.skill{background:#8b58c8}.ult{background:#e49b27}.cmd:disabled{filter:grayscale(1);opacity:.4;box-shadow:none}
.turn{text-align:center;font-weight:1000;font-size:13px;margin:2px}
.overlay{position:absolute;inset:0;background:#17121ee8;display:none;place-items:center;z-index:20;padding:25px}.overlay.on{display:grid}
.result{background:#fff;border-radius:22px;padding:22px;width:100%;text-align:center;box-shadow:0 8px 0 #b9aeb7}.result h2{font-size:30px;margin:0 0 10px}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:#fff;z-index:10}.flash.go{animation:flash .35s}@keyframes flash{50%{opacity:.75}}
.notice{text-align:center;font-size:11px;color:#756b75;margin:4px}
@media(min-width:600px){.selectWrap{grid-template-columns:repeat(3,1fr)}.charCard{display:block;text-align:center}.portrait{height:120px}}
</style>
</head>
<body>
<div id="game">
<section id="select" class="screen on">
  <div class="logo">⚔️ ことばバトル！</div>
  <div class="sub">Flashゲーム風・対AIバランステスト版</div>
  <div id="cards" class="selectWrap"></div>
  <div class="panel aiPick"><b>AI対戦相手</b><div id="aiRow" class="aiRow"></div></div>
  <button id="start" class="bigBtn" disabled>60秒育成を開始</button>
  <div class="notice">鬼灯・桃真の新特殊勝利条件は未確定のためOFF / ネフェル33回耐久はON</div>
</section>

<section id="growth" class="screen">
 <div class="topbar"><div id="gname" class="badge"></div><div id="timer" class="timer">60.0</div><div class="badge">AIも育成中</div></div>
 <div id="gstats" class="stats"></div>
 <div id="word" class="wordBox">文字をタップ</div>
 <div id="tiles" class="tiles"></div>
 <div class="tools">
  <button id="dak" class="tool">゛ 濁点</button><button id="han" class="tool">゜ 半濁点</button>
  <button id="small" class="tool">小文字</button><button id="back" class="tool">1文字消す</button>
  <button id="carry" class="tool" disabled>引継ぎ：なし</button><button id="reroll" class="tool">10文字変更</button>
  <button id="clear" class="tool">クリア</button><button id="submit" class="tool decide">この言葉で決定</button>
 </div>
 <div id="glog" class="growLog"></div>
</section>

<section id="battle" class="screen">
 <div id="turn" class="turn">TURN 1</div>
 <div class="arena">
  <div class="fighter enemy"><div><div id="emeta" class="fmeta"></div><div class="hpbar"><div id="ehp" class="hpfill"></div></div><div id="eeff" class="effects"></div></div><div id="eav" class="avatar"></div></div>
  <div class="vs">VS</div>
  <div class="fighter"><div id="pav" class="avatar"></div><div><div id="pmeta" class="fmeta"></div><div class="hpbar"><div id="php" class="hpfill"></div></div><div id="peff" class="effects"></div></div></div>
  <div id="blog" class="battleLog"></div>
 </div>
 <div class="commands">
  <button class="cmd attack" data-cmd="attack">⚔️ 攻撃</button>
  <button class="cmd guard" data-cmd="guard">🛡️ 防御</button>
  <button id="skillBtn" class="cmd skill" data-cmd="skill">✨ 固有技</button>
  <button id="ultBtn" class="cmd ult" data-cmd="ult">🔥 必殺固有技</button>
 </div>
</section>
<div id="flash" class="flash"></div>
<div id="overlay" class="overlay"><div class="result"><h2 id="resultTitle"></h2><div id="resultText"></div><br><button id="retry" class="bigBtn">もう一度</button></div></div>
</div>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const screens={select:$("select"),growth:$("growth"),battle:$("battle")};
const C={
 hozuki:{name:"鬼灯",icon:"🔥👹",tag:"2文字・攻撃特化",desc:"短い言葉で、一気に攻める！",hp:100,def:0,atk:7,skill:"二連撃",ult:"鬼神化"},
 nefer:{name:"ネフェル",icon:"🔺👑",tag:"3文字・防御特化",desc:"守りを固めて、すべてを耐え抜く。",hp:100,def:4,atk:4,skill:"三角結界",ult:"魅了"},
 toma:{name:"桃真",icon:"🍑🐕🐒🐦",tag:"4文字以上・HP特化",desc:"たくさんの言葉で、もっと強くなれるよ！",hp:100,def:5,atk:2,skill:"黍団子",ult:"四人共闘"}
};
let pick=null,aiPick=null,phase="select",P=null,A=null,selected="",carry="",lastSuccess="",rerollAt=0,growthStart=0,timerRAF=0,turn=1,busy=false;
const pool="あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわ";
const dak={か:"が",き:"ぎ",く:"ぐ",け:"げ",こ:"ご",さ:"ざ",し:"じ",す:"ず",せ:"ぜ",そ:"ぞ",た:"だ",ち:"ぢ",つ:"づ",て:"で",と:"ど",は:"ば",ひ:"び",ふ:"ぶ",へ:"べ",ほ:"ぼ"};
const han={は:"ぱ",ひ:"ぴ",ふ:"ぷ",へ:"ぺ",ほ:"ぽ"},sm={や:"ゃ",ゆ:"ゅ",よ:"ょ",つ:"っ"};
function show(n){Object.values(screens).forEach(x=>x.classList.remove("on"));screens[n].classList.add("on");phase=n}
function mkCards(){
 $("cards").innerHTML=Object.entries(C).map(([k,c])=>`<button class="charCard ${k}" data-k="${k}"><div class="portrait">${c.icon}</div><div><div class="cname">${c.name}</div><div class="ctag">${c.tag}</div><div class="cdesc">${c.desc}</div></div></button>`).join("");
 $("aiRow").innerHTML=Object.entries(C).map(([k,c])=>`<button class="mini" data-ai="${k}">${c.name}</button>`).join("");
 document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{pick=b.dataset.k;document.querySelectorAll("[data-k]").forEach(x=>x.classList.toggle("sel",x===b));ready()});
 document.querySelectorAll("[data-ai]").forEach(b=>b.onclick=()=>{aiPick=b.dataset.ai;document.querySelectorAll("[data-ai]").forEach(x=>x.classList.toggle("sel",x===b));ready()});
}
function ready(){$("start").disabled=!(pick&&aiPick)}
function fighter(k){let c=C[k];return {k,name:c.name,hp:c.hp,maxHp:c.hp,atk:c.atk,def:c.def,skillUses:3,skillCd:0,usedSkill:false,ultReadyWord:false,ultUsed:false,guard:false,tri:0,charm:0,oniAtk:false,oniDef:false,tomaDebuff:0,tomaBuff:0,received:0}}
function rnd(n){return Math.floor(Math.random()*n)}
function letters(){return Array.from({length:10},()=>pool[rnd(pool.length)])}
let currentLetters=[];
function drawLetters(){currentLetters=letters();$("tiles").innerHTML=currentLetters.map(x=>`<button class="tile">${x}</button>`).join("");$("tiles").querySelectorAll(".tile").forEach((b,i)=>b.onclick=()=>{selected+=currentLetters[i];drawWord()})}
function drawWord(){$("word").textContent=selected||"文字をタップ"}
function trans(map){if(!selected)return;let a=[...selected],x=a.pop();a.push(map[x]||x);selected=a.join("");drawWord()}
function logG(s){$("glog").innerHTML=s+"<br>"+$("glog").innerHTML}
function startGrowth(){
 P=fighter(pick);A=fighter(aiPick);selected="";carry="";lastSuccess="";rerollAt=0;
 show("growth");$("gname").textContent=C[pick].icon+" "+C[pick].name;$("glog").innerHTML="60秒育成スタート！";drawLetters();drawWord();drawG();
 growthStart=performance.now();cancelAnimationFrame(timerRAF);timerRAF=requestAnimationFrame(tick);
}
function tick(now){if(phase!=="growth")return;let left=Math.max(0,60-(now-growthStart)/1000);$("timer").textContent=left.toFixed(1);if(left<=0){finishGrowth();return}timerRAF=requestAnimationFrame(tick)}
function drawG(){$("gstats").textContent=`HP ${P.hp}　防御 ${P.def}　攻撃 ${P.atk}`;$("carry").textContent=carry?`引継ぎ：${carry}`:"引継ぎ：なし";$("carry").disabled=!carry}
function validWord(w){return /^[ぁ-ゖー]{2,}$/.test(w)}
function applyGrowth(f,w,shir=false){
 let n=[...w].length,dh=0,dd=0,da=0;
 if(n===2){da=3+rnd(5);if(f.k==="hozuki")da++}
 else if(n===3){dd=3+rnd(5);da=1;if(f.k==="nefer")dd++}
 else if(n===4){dh=6+rnd(9);da=1;if(f.k==="toma")dh++}
 else {da=2+rnd(4);dd=2+rnd(4);dh=4+rnd(5);let ex=Math.max(0,n-5)*2;da+=ex;dd+=ex;dh+=ex;if(f.k==="toma")dh+=20+(n-5)*10}
 if(shir){if(f.k==="hozuki")da+=2;if(f.k==="nefer")dd+=1;if(f.k==="toma")dh+=5}
 f.atk+=da;f.def+=dd;f.hp+=dh;f.maxHp+=dh;if(n>=5)f.ultReadyWord=true;
 return `HP+${dh} 防御+${dd} 攻撃+${da}${shir?" / しりとりBONUS":""}`;
}
$("submit").onclick=()=>{if(phase!=="growth")return;let w=selected;if(!validWord(w)){logG("❌ 2文字以上のひらがなで入力");return}let shir=!!(lastSuccess&&[...lastSuccess].at(-1)===[...w][0]);let r=applyGrowth(P,w,shir);carry=[...w].at(-1);lastSuccess=w;selected="";drawLetters();drawWord();drawG();logG(`⭕ ${w}　${r}`)};
$("dak").onclick=()=>trans(dak);$("han").onclick=()=>trans(han);$("small").onclick=()=>trans(sm);
$("back").onclick=()=>{selected=[...selected].slice(0,-1).join("");drawWord()};$("clear").onclick=()=>{selected="";drawWord()};
$("carry").onclick=()=>{if(carry){selected+=carry;carry="";drawWord();drawG()}};
$("reroll").onclick=()=>{let now=Date.now();if(now-rerollAt<5000){logG(`変更まであと${Math.ceil((5000-(now-rerollAt))/1000)}秒`);return}rerollAt=now;drawLetters();logG("🔄 10文字を変更")};
function aiGrow(){
 let t=0;
 while(t<60){
  let n;
  let r=Math.random();
  if(A.k==="hozuki") n=r<.75?2:(r<.88?3:r<.95?4:5+rnd(3));
  else if(A.k==="nefer") n=r<.50?3:(r<.70?2:r<.86?4:5+rnd(3));
  else n=r<.15?4:(r<.55?5+rnd(4):(r<.75?3:2));
  let think=n===2?2:n===3?3.5:n===4?4.5:(3+.3*(n-5)+.5*n);
  if(t+think>60)break;t+=think;applyGrowth(A,"あ".repeat(n),Math.random()<.4);
 }
}
function finishGrowth(){if(phase!=="growth")return;cancelAnimationFrame(timerRAF);aiGrow();show("battle");turn=1;logB("⚔️ バトル開始！");drawBattle()}
function effDef(x){let d=x.def;if(x.tri>0)d*=3;if(x.oniDef)d=Math.floor(d/2);return d}
function logB(s){$("blog").innerHTML=s+"<br>"+$("blog").innerHTML}
function attack(att,def,mult=1,label="攻撃"){
 let atk=att.atk*(att.oniAtk?2:1)*mult;if(att.tomaBuff>0)atk+=11;
 let ddef=effDef(def)-(def.tomaDebuff>0?22:0);let dmg=Math.max(1,Math.floor(atk-ddef));if(def.guard)dmg=Math.max(1,Math.ceil(dmg/2));
 def.hp=Math.max(0,def.hp-dmg);def.received++;if(att.oniAtk)att.oniAtk=false;if(def.oniDef)def.oniDef=false;if(def.tomaDebuff>0)def.tomaDebuff--;
 if(att.skillCd>0)att.skillCd--;flash(def===P?"pav":"eav");logB(`${att.name}の${label}！ ${dmg}ダメージ`);
}
function useSkill(x,y){
 if(x.skillUses<=0||x.skillCd>0)return false;x.skillUses--;x.usedSkill=true;
 if(x.k==="hozuki"){logB("🔥 二連撃！");attack(x,y,1,"一撃目");if(y.hp>0)attack(x,y,1,"二撃目");x.skillCd=3; x.skillCd=Math.max(0,x.skillCd-2)}
 if(x.k==="nefer"){x.tri=3;x.skillCd=3;logB("🔺 三角結界！ 防御×3（3ターン）")}
 if(x.k==="toma"){x.hp+=22;x.maxHp+=22;x.skillCd=3;logB("🍡 黍団子！ HP+22")}
 return true;
}
function useUlt(x,y){
 if(x.ultUsed||!x.ultReadyWord||!x.usedSkill)return false;x.ultUsed=true;
 if(x.k==="hozuki"){x.hp=Math.ceil(x.hp/2);x.oniAtk=true;x.oniDef=true;logB("👹 鬼神化！ HP半減・次の攻撃ATK×2・次に受ける攻撃時DEF半減")}
 if(x.k==="nefer"){y.charm=3;logB("👑 魅了！ 相手は3ターン通常攻撃しか選べない")}
 if(x.k==="toma"){y.tomaDebuff=2;y.hp=Math.max(0,y.hp-33);x.tomaBuff=4;logB("🍑 四人共闘！ 固定33ダメージ・相手DEF-22×2・ATK+11×4ターン")}
 return true;
}
function canUlt(x){return !x.ultUsed&&x.ultReadyWord&&x.usedSkill}
function aiCommand(){
 if(A.charm>0)return"attack";
 if(canUlt(A)){
  if(A.k==="nefer"&&A.received>=27)return"ult";
  if(A.k==="hozuki"&&A.hp>A.maxHp*.45&&Math.random()<.35)return"ult";
  if(A.k==="toma"&&Math.random()<.35)return"ult";
 }
 if(A.skillUses>0&&A.skillCd===0){
  if(A.k==="nefer"&&Math.random()<.35)return"skill";
  if(A.k==="hozuki"&&Math.random()<.38)return"skill";
  if(A.k==="toma"&&A.hp<A.maxHp*.7)return"skill";
 }
 if(A.hp<A.maxHp*.35&&Math.random()<.25)return"guard";
 return"attack";
}
function resolve(actor,target,cmd){
 if(actor.charm>0)cmd="attack";
 if(cmd==="attack")attack(actor,target);
 else if(cmd==="guard"){actor.guard=true;logB(`🛡️ ${actor.name}は防御態勢！`)}
 else if(cmd==="skill"){if(!useSkill(actor,target))attack(actor,target)}
 else if(cmd==="ult"){if(!useUlt(actor,target))attack(actor,target)}
}
function endTurn(){
 [P,A].forEach(x=>{if(x.tri>0)x.tri--;if(x.charm>0)x.charm--;if(x.tomaBuff>0)x.tomaBuff--;x.guard=false});
 if(P.hp<=0||A.hp<=0){finishBattle(P.hp>0?"WIN!":"LOSE...",P.hp>0?"相手のHPを0にしました。":"あなたのHPが0になりました。");return true}
 if(P.k==="nefer"&&P.received>=33&&P.hp>0){finishBattle("SPECIAL WIN!","ネフェルが33回の攻撃を耐え抜きました！");return true}
 if(A.k==="nefer"&&A.received>=33&&A.hp>0){finishBattle("SPECIAL LOSE...","AIネフェルが33回の攻撃を耐え抜きました。");return true}
 turn++;return false;
}
function playerCommand(cmd){
 if(busy||phase!=="battle")return;if(P.charm>0)cmd="attack";busy=true;
 let ac=aiCommand();logB(`— TURN ${turn} —`);
 // 同時選択→素早さ概念なし。プレイヤー→AIの順で処理するが、同ターン選択済みならHP0でも反撃を許可
 let aAlive=A.hp>0,pAlive=P.hp>0;resolve(P,A,cmd);resolve(A,P,ac);
 endTurn();drawBattle();setTimeout(()=>busy=false,220);
}
function drawBattle(){
 $("turn").textContent=`TURN ${turn}`;
 $("pav").textContent=C[P.k].icon;$("eav").textContent=C[A.k].icon;
 $("pmeta").textContent=`${P.name}　HP ${P.hp}/${P.maxHp}　ATK ${P.atk}　DEF ${P.def}　被弾 ${P.received}`;
 $("emeta").textContent=`AI ${A.name}　HP ${A.hp}/${A.maxHp}　ATK ${A.atk}　DEF ${A.def}　被弾 ${A.received}`;
 $("php").style.width=(100*P.hp/P.maxHp)+"%";$("ehp").style.width=(100*A.hp/A.maxHp)+"%";
 $("peff").textContent=effects(P);$("eeff").textContent=effects(A);
 $("skillBtn").textContent=`✨ ${C[P.k].skill} (${P.skillUses})${P.skillCd?` CD${P.skillCd}`:""}`;
 $("ultBtn").textContent=`🔥 ${C[P.k].ult}`;
 $("skillBtn").disabled=P.charm>0||P.skillUses<=0||P.skillCd>0;
 $("ultBtn").disabled=P.charm>0||!canUlt(P);
 document.querySelectorAll(".cmd:not(#skillBtn):not(#ultBtn)").forEach(b=>{if(b.dataset.cmd==="guard")b.disabled=P.charm>0});
}
function effects(x){let a=[];if(x.tri)a.push(`結界${x.tri}`);if(x.charm)a.push(`魅了${x.charm}`);if(x.oniAtk)a.push("鬼神攻撃待機");if(x.oniDef)a.push("鬼神防御低下");if(x.tomaBuff)a.push(`共闘ATK+11:${x.tomaBuff}`);if(x.tomaDebuff)a.push(`DEF-22:${x.tomaDebuff}撃`);return a.join(" / ")||"状態異常なし"}
function flash(id){$(id).classList.remove("hit");void $(id).offsetWidth;$(id).classList.add("hit");$("flash").classList.remove("go");void $("flash").offsetWidth;$("flash").classList.add("go")}
function finishBattle(title,text){phase="end";$("resultTitle").textContent=title;$("resultText").textContent=text;$("overlay").classList.add("on")}
document.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>playerCommand(b.dataset.cmd));
$("retry").onclick=()=>location.reload();$("start").onclick=startGrowth;
mkCards();
})();
</script>
</body></html>
