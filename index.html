<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>ことばバトル！ 対AIプロトタイプ</title>
<style>
:root{--bg:#fff8ee;--ink:#2d2430;--card:#fff;--line:#eadfda;--accent:#ff6b7a;--good:#2f9e72;--bad:#d9485f;--gold:#d99a18;--blue:#4776d0}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:linear-gradient(#fff8ee,#f4f2ff);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0} button:disabled{opacity:.4;cursor:not-allowed}.wrap{max-width:920px;margin:auto;padding:14px 14px 40px}.title{text-align:center;font-size:clamp(28px,7vw,48px);font-weight:900;margin:12px 0 4px}.sub{text-align:center;color:#776b74;margin-bottom:18px}.panel{background:#ffffffdd;border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #6c526016}.hidden{display:none!important}.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.char{border:2px solid transparent;border-radius:18px;padding:14px;background:#fff;text-align:center}.char.selected{border-color:var(--accent);transform:translateY(-2px)}.emoji{font-size:46px}.name{font-weight:900;font-size:20px}.desc{font-size:12px;color:#776b74;min-height:34px}.stats{font-size:12px;margin-top:8px}.primary{width:100%;padding:14px;border-radius:16px;background:var(--ink);color:#fff;font-weight:900}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}.badge{padding:6px 10px;border-radius:999px;background:#f1ebef;font-size:12px;font-weight:800}.timer{font-size:32px;font-weight:1000;text-align:center}.letters{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.letter{padding:14px 0;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:24px;font-weight:900}.word{min-height:58px;padding:12px;border:2px dashed #d9cbd2;border-radius:16px;font-size:28px;font-weight:900;text-align:center;background:#fff}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.smallbtn{padding:11px 6px;border-radius:12px;background:#eee7eb;font-weight:800}.confirm{background:var(--accent);color:#fff}.log{height:190px;overflow:auto;background:#211d24;color:#f7edf4;border-radius:16px;padding:12px;font-size:13px;line-height:1.55}.battle-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fighter{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}.hpbar{height:16px;background:#eee;border-radius:999px;overflow:hidden;margin:8px 0}.hpfill{height:100%;background:linear-gradient(90deg,#58c78c,#91d95c);transition:.25s}.commands{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.cmd{padding:14px 8px;border-radius:14px;background:#2d2430;color:#fff;font-weight:900}.cmd.skill{background:#5f55a5}.cmd.ult{background:#bd5b24}.cmd.guard{background:#4776d0}.note{font-size:12px;color:#776b74}.result{font-size:28px;text-align:center;font-weight:1000}.debug{font-size:12px}.aiThinking{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.45}}@media(max-width:650px){.chars{grid-template-columns:1fr}.battle-grid{grid-template-columns:1fr}.controls{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div class="wrap">
<div class="title">ことばバトル！</div><div class="sub">対AI・バランス確認プロトタイプ</div>
<section id="select" class="panel"><h2>キャラクターを選択</h2><div id="charCards" class="chars"></div><h3>AI対戦相手</h3><div id="aiCards" class="chars"></div><button id="start" class="primary" disabled>60秒育成を開始</button></section>
<section id="growth" class="hidden"><div class="panel"><div class="row"><span id="gchar" class="badge"></span><span class="grow"></span><span class="badge">AIも育成中</span></div><div id="timer" class="timer">60.0</div><div id="gstats" style="text-align:center;font-weight:900"></div></div>
<div class="panel"><div class="note">表示文字は何度でも使えます。試作版の単語判定は簡易判定です（2文字以上のひらがな）。</div><div id="word" class="word"></div><div id="letters" class="letters" style="margin-top:10px"></div><div class="controls" style="margin-top:10px"><button id="dak" class="smallbtn">゛ 濁点</button><button id="han" class="smallbtn">゜ 半濁点</button><button id="small" class="smallbtn">小文字</button><button id="back" class="smallbtn">1文字消す</button><button id="carry" class="smallbtn">引継ぎ：なし</button><button id="reroll" class="smallbtn">10文字変更</button><button id="clear" class="smallbtn">クリア</button><button id="submit" class="smallbtn confirm">この言葉で決定</button></div></div>
<div class="panel"><b>育成ログ</b><div id="growlogEl" class="log"></div></div></section>
<section id="battle" class="hidden"><div class="panel"><div class="row"><span class="badge">コマンドアクションバトル</span><span class="grow"></span><span id="turn" class="badge">TURN 1</span></div><div class="battle-grid" style="margin-top:10px"><div id="pf" class="fighter"></div><div id="af" class="fighter"></div></div></div>
<div class="panel"><h3>コマンド選択</h3><div id="commands" class="commands"></div><p class="note">両者の行動は同じターンに処理します。防御は試作用に「そのターン防御力2倍」です。</p></div><div class="panel"><b>戦闘ログ</b><div id="battlelogEl" class="log"></div></div></section>
<section id="end" class="panel hidden"><div id="result" class="result"></div><button onclick="location.reload()" class="primary" style="margin-top:14px">もう一度遊ぶ</button></section>
</div>
<script>
const $=id=>document.getElementById(id);
const charCardsEl=$('charCards'), aiCardsEl=$('aiCards'), startBtn=$('start'), selectEl=$('select'), growthEl=$('growth'), gcharEl=$('gchar'), timerEl=$('timer'), gstatsEl=$('gstats'), wordEl=$('word'), lettersEl=$('letters'), dakBtn=$('dak'), hanBtn=$('han'), smallBtn=$('small'), backBtn=$('back'), carryBtnEl=$('carry'), rerollBtn=$('reroll'), clearBtn=$('clear'), submitBtn=$('submit'), growlogEl=$('growlogEl'), battleEl=$('battle'), pfEl=$('pf'), afEl=$('af'), turnEl=$('turn'), commandsEl=$('commands'), battlelogEl=$('battlelogEl'), endEl=$('end'), resultEl=$('result');
const C={
 hozuki:{name:'鬼灯',icon:'🔥👹',desc:'短い言葉で、一気に攻める！',hp:100,def:0,atk:7,spec:'2文字・攻撃特化',skill:'二連撃',ult:'鬼神化'},
 nefer:{name:'ネフェル',icon:'🔺👑',desc:'守りを固めて、すべてを耐え抜く。',hp:100,def:4,atk:4,spec:'3文字・防御特化',skill:'三角結界',ult:'魅了'},
 toma:{name:'桃真',icon:'🍑🐕🐒🐦',desc:'たくさんの言葉で、もっと強くなれるよ！',hp:100,def:5,atk:2,spec:'4文字以上・HP特化',skill:'黍団子',ult:'四人共闘'}
};
let pk=null,ak=null,P,A,phase='select',remain=60,last=performance.now(),paused=false,sel='',carry='',rerollReady=0,turn=1,ended=false;
const pool='あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'.split('');
const dakMap={か:'が',き:'ぎ',く:'ぐ',け:'げ',こ:'ご',さ:'ざ',し:'じ',す:'ず',せ:'ぜ',そ:'ぞ',た:'だ',ち:'ぢ',つ:'づ',て:'で',と:'ど',は:'ば',ひ:'び',ふ:'ぶ',へ:'べ',ほ:'ぼ'},hanMap={は:'ぱ',ひ:'ぴ',ふ:'ぷ',へ:'ぺ',ほ:'ぽ'},smallMap={や:'ゃ',ゆ:'ゅ',よ:'ょ',つ:'っ'};
function card(k,ai=false){let c=C[k];return `<button class="char" data-k="${k}" data-ai="${ai}"><div class="emoji">${c.icon}</div><div class="name">${c.name}</div><div class="desc">${c.desc}</div><div class="stats">${c.spec}<br>HP${c.hp} / 防御${c.def} / 攻撃${c.atk}</div></button>`}
charCardsEl.innerHTML=Object.keys(C).map(k=>card(k)).join('');aiCardsEl.innerHTML=Object.keys(C).map(k=>card(k,true)).join('');
document.querySelectorAll('.char').forEach(b=>b.onclick=()=>{let ai=b.dataset.ai==='true';document.querySelectorAll(`.char[data-ai="${ai}"]`).forEach(x=>x.classList.remove('selected'));b.classList.add('selected');if(ai)ak=b.dataset.k;else pk=b.dataset.k;startBtn.disabled=!(pk&&ak)});
function mk(k){let c=C[k];return {k,name:c.name,hp:c.hp,max:c.hp,def:c.def,atk:c.atk,skillUses:3,cd:0,skillEver:false,ult:1,five:false,received:0,guard:0,barrier:0,charm:0,defDebuffHits:0,atkBuffTurns:0,oniAtk:false,oniDef:false,words:0}}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a} function rollLetters(){lettersEl.innerHTML='';for(let i=0;i<10;i++){let x=pool[rnd(0,pool.length-1)],b=document.createElement('button');b.className='letter';b.textContent=x;b.onclick=()=>{sel+=x;drawWord()};lettersEl.appendChild(b)}}
function drawWord(){wordEl.textContent=sel||'　'} function log(el,s){el.innerHTML+=s+'<br>';el.scrollTop=el.scrollHeight}
startBtn.onclick=()=>{last=performance.now();P=mk(pk);A=mk(ak);selectEl.classList.add('hidden');growthEl.classList.remove('hidden');gcharEl.textContent=`${C[pk].icon} ${P.name}`;rollLetters();drawGrowth();requestAnimationFrame(tick)};
function drawGrowth(){gstatsEl.textContent=`HP ${P.hp}　防御 ${P.def}　攻撃 ${P.atk}`;carryBtn();}
function carryBtn(){carryBtnEl.textContent='引継ぎ：'+(carry||'なし');carryBtnEl.disabled=!carry}
function tick(t){if(phase!=='select'&&!ended){let d=(t-last)/1000;last=t;if(phase==='growth'&&!paused){remain-=d;timerEl.textContent=Math.max(0,remain).toFixed(1);if(remain<=0){finishGrowth();return}}requestAnimationFrame(tick)}else last=t}
function applyGrowth(x,w,who,shir=false){let n=w.length,ga=0,gd=0,gh=0;if(n===2){ga=rnd(3,7);if(x.k==='hozuki')ga++}else if(n===3){gd=rnd(3,7);ga=1;if(x.k==='nefer')gd++}else if(n===4){gh=rnd(6,14);ga=1;if(x.k==='toma')gh++}else if(n>=5){ga=rnd(2,5);gd=rnd(2,5);gh=rnd(4,8);let ex=(n-5)*2;ga+=ex;gd+=ex;gh+=ex;if(x.k==='toma')gh+=20+(n-5)*10;x.five=true}if(shir){if(x.k==='hozuki')ga+=2;if(x.k==='nefer')gd+=1;if(x.k==='toma')gh+=5}x.atk+=ga;x.def+=gd;x.hp+=gh;x.max+=gh;x.words++;return `HP+${gh} 防御+${gd} 攻撃+${ga}${shir?' / しりとり!':''}`}
submitBtn.onclick=()=>{if(sel.length<2)return log(growlogEl,'❌ 2文字以上にしてください');let w=sel,shir=!!carry&&w[0]===carry;let r=applyGrowth(P,w,'p',shir);carry=w.at(-1);log(growlogEl,`✅ ${w}（${w.length}文字） → ${r}`);sel='';drawWord();rollLetters();drawGrowth()};backBtn.onclick=()=>{sel=sel.slice(0,-1);drawWord()};clearBtn.onclick=()=>{sel='';drawWord()};carryBtnEl.onclick=()=>{if(carry){sel+=carry;carry='';drawWord();carryBtn()}};function transform(map){if(!sel)return;let z=sel.at(-1);if(map[z])sel=sel.slice(0,-1)+map[z];drawWord()}dakBtn.onclick=()=>transform(dakMap);hanBtn.onclick=()=>transform(hanMap);smallBtn.onclick=()=>transform(smallMap);rerollBtn.onclick=()=>{let now=Date.now();if(now<rerollReady)return;rerollReady=now+5000;rollLetters();rerollBtn.disabled=true;setTimeout(()=>rerollBtn.disabled=false,5000)};
function aiGrow(){let time=60,dist;if(ak==='hozuki')dist=[[2,.75],[3,.10],[4,.07],[5,.05],[6,.02],[7,.01]];else if(ak==='nefer')dist=[[2,.20],[3,.50],[4,.13],[5,.09],[6,.05],[7,.03]];else dist=[[2,.15],[3,.10],[4,.15],[5,.20],[6,.12],[7,.08],[8,.06],[9,.04],[10,.10]];let cost=n=>n===2?2:n===3?3.5:n===4?4.5:3+.3*(n-5)+.5*n;while(true){let q=Math.random(),s=0,n=2;for(let [l,p] of dist){s+=p;if(q<=s){n=l;break}}let c=cost(n);if(time<c)break;time-=c;let fake='あ'.repeat(n),shir=Math.random()<.4;applyGrowth(A,fake,'a',shir)} }
function finishGrowth(){phase='battle';aiGrow();growthEl.classList.add('hidden');battleEl.classList.remove('hidden');drawBattle();log(battlelogEl,`⚔️ ${P.name} vs ${A.name} バトル開始！`)}
function effDef(x){let d=x.def;if(x.guard)d*=2;if(x.barrier)d*=3;if(x.oniDef)d=Math.ceil(d/2);if(x.defDebuffHits>0)d=Math.max(0,d-22);return d}
function fighterHTML(x){let pct=Math.max(0,Math.min(100,x.hp/x.max*100));return `<div class="name">${C[x.k].icon} ${x.name}</div><div>HP ${x.hp} / ${x.max}</div><div class="hpbar"><div class="hpfill" style="width:${pct}%"></div></div><div>攻撃 ${x.atk}${x.atkBuffTurns?'<b> (+11)</b>':''} / 防御 ${x.def}</div><div class="note">通常技 残${x.skillUses} / CT ${x.cd}　必殺 ${x.ult?'可':'済'}<br>被攻撃 ${x.received}回${x.barrier?' / 結界':''}${x.charm?' / 魅了':''}</div>`}
function drawBattle(){pfEl.innerHTML=fighterHTML(P);afEl.innerHTML=fighterHTML(A);document.getElementById('turn').textContent='TURN '+turn;let arr=[['attack','⚔️ 攻撃',''],['guard','🛡️ 防御','guard'],['skill',`✨ ${C[P.k].skill}`,'skill'],['ult',`🔥 ${C[P.k].ult}`,'ult']];commandsEl.innerHTML=arr.map(([a,l,cl])=>`<button class="cmd ${cl}" data-a="${a}" ${!can(P,a)?'disabled':''}>${l}</button>`).join('');document.querySelectorAll('.cmd').forEach(b=>b.onclick=()=>resolve(b.dataset.a,aiChoose()))}
function can(x,a){if(x.charm>0)return a==='attack';if(a==='skill')return x.skillUses>0&&x.cd===0;if(a==='ult')return x.ult>0&&x.five&&x.skillEver;return true}
function aiChoose(){let opts=['attack','guard'];if(can(A,'skill'))opts.push('skill');if(can(A,'ult'))opts.push('ult');return opts[rnd(0,opts.length-1)]}
function resolve(pa,aa){if(ended)return;let actions=[[P,A,pa,'あなた'],[A,P,aa,'AI']];P.guard=A.guard=0;for(let [x,y,a,who] of actions){if(a==='guard'){x.guard=1;log(battlelogEl,`🛡️ ${who}の${x.name}は防御！`)}}
for(let [x,y,a,who] of actions){if(a==='skill')useSkill(x,y,who);if(a==='ult')useUlt(x,y,who)}
let attacks=[];for(let [x,y,a,who] of actions){if(a==='attack')attacks.push([x,y,1,who]);if(a==='skill'&&x.k==='hozuki')attacks.push([x,y,2,who]);}
for(let [x,y,c,who] of attacks)for(let i=0;i<c;i++)hit(x,y,who);
endTurn(P);endTurn(A);checkWin();if(!ended){turn++;drawBattle()}}
function useSkill(x,y,who){x.skillUses--;x.skillEver=true;x.cd=3;if(x.k==='hozuki'){log(battlelogEl,`🔥 ${who}：二連撃！`)}else if(x.k==='nefer'){x.barrier=4;log(battlelogEl,`🔺 ${who}：三角結界！ 防御力3倍×3ターン`)}else{x.hp+=22;x.max+=22;log(battlelogEl,`🍡 ${who}：黍団子！ HP+22`)}}
function useUlt(x,y,who){x.ult=0;if(x.k==='hozuki'){x.hp=Math.ceil(x.hp/2);x.oniAtk=true;x.oniDef=true;log(battlelogEl,`👹 ${who}：鬼神化！ HP半減、次の攻撃2倍／次の被攻撃時防御半減`)}else if(x.k==='nefer'){y.charm=4;log(battlelogEl,`💜 ${who}：魅了！ ${y.name}は3ターン通常攻撃のみ`)}else{y.defDebuffHits=2;y.hp-=33;x.atkBuffTurns=5;log(battlelogEl,`🐕🐒🐦 ${who}：四人共闘！ 33固定ダメージ、防御-22×2回、攻撃+11×4ターン`)}}
function hit(x,y,who){let atk=x.atk+(x.atkBuffTurns?11:0);if(x.oniAtk){atk*=2;x.oniAtk=false}let d=Math.max(1,atk-effDef(y));y.hp-=d;y.received++;log(battlelogEl,`⚔️ ${who}の${x.name} → ${d}ダメージ`);if(x.cd>0)x.cd--;if(y.defDebuffHits>0)y.defDebuffHits--;if(y.oniDef)y.oniDef=false}
function endTurn(x){if(x.barrier>0)x.barrier--;if(x.charm>0)x.charm--;if(x.atkBuffTurns>0)x.atkBuffTurns--;x.guard=0}
function checkWin(){let ps=P.hp<=0,as=A.hp<=0, psp=P.k==='nefer'&&P.received>=33&&P.hp>0, asp=A.k==='nefer'&&A.received>=33&&A.hp>0;if((ps&&as)||(psp&&asp))return finish('相打ち！');if(ps)return finish(`AIの${A.name}の勝利！`);if(as)return finish(`あなたの${P.name}の勝利！`);if(psp)return finish(`👑 ネフェルが33回の攻撃を耐え抜いた！ 特殊勝利！`);if(asp)return finish(`👑 AIネフェルが33回の攻撃を耐え抜いた！ 特殊勝利！`)}
function finish(s){ended=true;battleEl.classList.add('hidden');endEl.classList.remove('hidden');resultEl.textContent=s}
</script></body></html>
